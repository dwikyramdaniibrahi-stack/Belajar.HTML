</head>
<body>
    
    <!-- Navbar  -->
     <nav class="navbar">
        <img class="navbar-image" src="my-logo.png" alt="logo Kedai Kopi Dwiky">
        <a href="#" class="navbar-logo">Kedai kopi<span>Dwiky</span>.</a>
            <div class="navbar-nav ">
                <a href="#home">Home</a>
                <a href="#menu">Menu</a>
                <a href="#about">About</a>
                <a href="#contact">Kontak</a>
            </div>

            <div class="navbar-extra">
                <a href="#" id="search"><i data-feather="search"></i></a>
                <a href="#" id="Shopping-cart"><i data-feather="shopping-cart"></i></a>
                <button type="button" class="navbar-login" id="loginOpen">Login</button>
                <a href="#" id="Menu"><i data-feather="menu"></i></a>
            </div>
        


     </nav>

      <dialog class="login-dialog" id="loginDialog" aria-labelledby="loginTitle">
        <button type="button" class="login-close" id="loginClose" aria-label="Tutup form">&times;</button>
          <form class="login-form" id="loginForm" action="login.php" method="post">
                <h1 id="loginTitle">Login</h1>
                <label for="username">Nama pengguna</label>
                <input type="text" id="username" name="username" placeholder="Masukkan nama pengguna" autocomplete="username" required>
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
                <button type="submit" class="login-button">Masuk</button>
            <button type="button" class="login-switch" id="showRegister">Belum punya akun? Daftar</button>
                <p class="login-message" id="loginMessage" role="status"></p>
          </form>

        <form class="login-form" id="registerForm" action="register.php" method="post" hidden>
            <h1>Buat akun</h1>
            <label for="registerUsername">Nama pengguna</label>
            <input type="text" id="registerUsername" name="username" placeholder="Buat nama pengguna" autocomplete="username" maxlength="100" required>
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" name="password" placeholder="Buat password (minimal 8 karakter)" autocomplete="new-password" minlength="8" required>
            <label for="province">Provinsi</label>
            <select id="province" name="province" required disabled>
              <option value="" selected>Pilih provinsi</option>
            </select>
            <label for="regionName">Kabupaten/Kota</label>
            <select id="regionName" name="region_name" required disabled>
              <option value="" selected>Pilih provinsi terlebih dahulu</option>
            </select>
            <button type="submit" class="login-button">Daftar</button>
            <button type="button" class="login-switch" id="showLogin">Sudah punya akun? Masuk</button>
            <p class="login-message" id="registerMessage" role="status"></p>
        </form>
      </dialog>

    <script>
      feather.replace();
    </script>

     <script src="script2.js"></script>

</body>
</html>
